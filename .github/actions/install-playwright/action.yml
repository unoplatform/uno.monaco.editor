name: "Install Playwright browsers"
description: "Resolve Microsoft.Playwright from NuGet cache by exact version and install Chromium"

inputs:
  playwright-version:
    description: "Exact Microsoft.Playwright package version (must match Directory.Packages.props)"
    required: true

runs:
  using: "composite"

  steps:
  - name: Install Playwright browsers
    shell: pwsh
    run: |
      $globalPkgs = (dotnet nuget locals global-packages --list | ForEach-Object { ($_ -split '\s+',2)[1].Trim() })
      $pwPkgPath = Join-Path $globalPkgs "microsoft.playwright/${{ inputs.playwright-version }}"
      if (-not (Test-Path $pwPkgPath)) { throw "Microsoft.Playwright ${{ inputs.playwright-version }} not found at $pwPkgPath" }
      $env:PLAYWRIGHT_DRIVER_SEARCH_PATH = $pwPkgPath
      "PLAYWRIGHT_DRIVER_SEARCH_PATH=$pwPkgPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      $scriptPath = Join-Path $pwPkgPath "build/playwright.ps1"
      if (-not (Test-Path $scriptPath)) { throw "playwright.ps1 not found at $scriptPath" }
      # The NuGet package keeps Microsoft.Playwright.dll in lib/netstandard2.0 but
      # build/playwright.ps1 expects it next to itself. Copy the DLL so the script
      # can load the Playwright driver without relying on MSBuild build targets
      # (which are excluded via ExcludeAssets to avoid UseArtifactsOutput conflicts).
      $dllSrc = Join-Path $pwPkgPath "lib/netstandard2.0/Microsoft.Playwright.dll"
      $dllDst = Join-Path $pwPkgPath "build/Microsoft.Playwright.dll"
      if ((Test-Path $dllSrc) -and -not (Test-Path $dllDst)) {
        Copy-Item $dllSrc $dllDst
        Write-Host "Copied Microsoft.Playwright.dll into build/ for playwright.ps1"
      }
      pwsh $scriptPath install --with-deps chromium
