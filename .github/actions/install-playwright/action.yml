name: "Install Playwright browsers"
description: "Resolve Microsoft.Playwright from NuGet cache by exact version and install Chromium"

inputs:
  playwright-version:
    description: "Exact Microsoft.Playwright package version (must match Directory.Packages.props)"
    required: true

runs:
  using: "composite"

  steps:
  - name: Install Playwright browsers
    shell: pwsh
    run: |
      $globalPkgs = (dotnet nuget locals global-packages --list | ForEach-Object { ($_ -split '\s+',2)[1].Trim() })
      $pwPkgPath = Join-Path $globalPkgs "microsoft.playwright/${{ inputs.playwright-version }}"
      if (-not (Test-Path $pwPkgPath)) { throw "Microsoft.Playwright ${{ inputs.playwright-version }} not found at $pwPkgPath" }
      # Set driver search path to the package root (contains .playwright/ with the
      # node driver). The build/playwright.ps1 script overrides this to $PSScriptRoot
      # but expects the DLL + .playwright/ to be in the build output (which our
      # ExcludeAssets prevents). Instead, invoke the Playwright CLI directly from the
      # NuGet cache with the correct search path.
      $env:PLAYWRIGHT_DRIVER_SEARCH_PATH = $pwPkgPath
      "PLAYWRIGHT_DRIVER_SEARCH_PATH=$pwPkgPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      $dllPath = Join-Path $pwPkgPath "lib/netstandard2.0/Microsoft.Playwright.dll"
      if (-not (Test-Path $dllPath)) { throw "Microsoft.Playwright.dll not found at $dllPath" }
      [Reflection.Assembly]::Load([System.IO.File]::ReadAllBytes($dllPath)) | Out-Null
      [Microsoft.Playwright.Program]::Main(@("install", "--with-deps", "chromium"))
