name: CI

on:
  push:
    branches:
      - main
      - release/*/*
  pull_request:
    branches:
      - main
      - release/*/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

# Required secrets for signing and publishing jobs:
# - SIGN_AZURE_CLIENT_ID: Azure client ID for code signing
# - SIGN_AZURE_TENANT_ID: Azure tenant ID for code signing
# - SIGN_AZURE_SUBSCRIPTION_ID: Azure subscription ID for code signing
# - SIGN_KEY_VAULT_URL: Azure Key Vault URL for code signing
# - SIGN_KEY_VAULT_CERTIFICATE_ID: Key Vault certificate ID for code signing
# - UNO_NUGET_FEED_API_KEY: API key for Uno NuGet feed publishing
# - NUGET_ORG_API_KEY: API key for NuGet.org publishing

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version (NBGV)
        id: nbgv
        uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
        with:
          toolVersion: 3.8.118
          setAllVars: true

      - name: Export informative version
        shell: pwsh
        run: |
          $buildingRef = "${{ github.ref }}"
          $informationalVersion = "${{ steps.nbgv.outputs.SemVer2 }}+${{ steps.nbgv.outputs.GitCommitId }}-$buildingRef" -replace 'refs/heads/','' -replace '/','-'
          "NBGV_AssemblyInformationalVersion=$informationalVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install wasm-tools wasm-tools-net9

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      - name: Prepare artifacts directory
        run: |
          rm -rf "${{ env.ARTIFACTS_DIR }}"
          mkdir -p "${{ env.ARTIFACTS_DIR }}/log"

      - name: Build library
        run: dotnet build MonacoEditorComponent/MonacoEditorComponent.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_DIR }}" /bl:"${{ env.ARTIFACTS_DIR }}/log/build.binlog"

      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_DIR }}"

      - name: Build WASM test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-browserwasm -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_DIR }}"

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $globalPkgs = dotnet nuget locals global-packages --list | ForEach-Object { ($_ -split '\s+',2)[1].Trim() }
          $pwPkg = Get-ChildItem -Path (Join-Path $globalPkgs "microsoft.playwright") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $pwDll = Join-Path $pwPkg.FullName "lib/netstandard2.0/Microsoft.Playwright.dll"
          if (-not (Test-Path $pwDll)) { throw "Microsoft.Playwright.dll not found at $pwDll" }
          $driverPath = $pwPkg.FullName
          $env:PLAYWRIGHT_DRIVER_SEARCH_PATH = $driverPath
          "PLAYWRIGHT_DRIVER_SEARCH_PATH=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          [Reflection.Assembly]::Load([System.IO.File]::ReadAllBytes($pwDll)) | Out-Null
          [Microsoft.Playwright.Program]::Main(@("install", "--with-deps", "chromium"))

      - name: Run tests
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_DIR }}" --no-build --coverage --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=DesktopCDP" --report-xunit --report-xunit-filename test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-ubuntu
          path: |
            ${{ env.ARTIFACTS_DIR }}/TestResults
            **/test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuGet
          path: ${{ env.ARTIFACTS_DIR }}/package/release
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ env.ARTIFACTS_DIR }}/log
          if-no-files-found: warn

  desktop-tests:
    name: Desktop Tests (Windows)
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      # Desktop test app build is covered by the macOS ARM job (both TFMs).
      # Skipping it here avoids needing the wasm-tools workload, since NuGet
      # restore evaluates all TFMs (including net10.0-browserwasm) even with -f.
      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release

      # Desktop CDP tests require a GUI environment (WebView2 needs a display).
      # GitHub Actions runners are headless, so CDP tests timeout on fixture init.
      # WASM Playwright tests are covered by the ubuntu and macOS jobs.
      # This job validates the desktop build compiles on Windows and runs unit tests.
      - name: Run unit tests
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release --no-build --coverage --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=DesktopCDP" --filter-not-trait "Category=WasmPlaywright" --report-xunit --report-xunit-filename desktop-test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          path: |
            **/desktop-test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  build-macos:
    name: Build (macOS ARM)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      - name: Build library
        run: dotnet build MonacoEditorComponent/MonacoEditorComponent.csproj -c Release

      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release

      - name: Build WASM test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-browserwasm -c Release

      - name: Build desktop test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-desktop -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $globalPkgs = dotnet nuget locals global-packages --list | ForEach-Object { ($_ -split '\s+',2)[1].Trim() }
          $pwPkg = Get-ChildItem -Path (Join-Path $globalPkgs "microsoft.playwright") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $pwDll = Join-Path $pwPkg.FullName "lib/netstandard2.0/Microsoft.Playwright.dll"
          if (-not (Test-Path $pwDll)) { throw "Microsoft.Playwright.dll not found at $pwDll" }
          $driverPath = $pwPkg.FullName
          $env:PLAYWRIGHT_DRIVER_SEARCH_PATH = $driverPath
          "PLAYWRIGHT_DRIVER_SEARCH_PATH=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          [Reflection.Assembly]::Load([System.IO.File]::ReadAllBytes($pwDll)) | Out-Null
          [Microsoft.Playwright.Program]::Main(@("install", "--with-deps", "chromium"))

      - name: Run tests
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release --no-build --coverage --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=DesktopCDP" --report-xunit --report-xunit-filename test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-macos
          path: |
            **/test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [build, desktop-tests, build-macos]
    if: always()
    steps:
      - name: Download coverage (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu
          path: ./coverage-ubuntu
        continue-on-error: true

      - name: Download coverage (windows)
        uses: actions/download-artifact@v4
        with:
          name: coverage-windows
          path: ./coverage-windows
        continue-on-error: true

      - name: Download coverage (macOS)
        uses: actions/download-artifact@v4
        with:
          name: coverage-macos
          path: ./coverage-macos
        continue-on-error: true

      - name: Merge and generate report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.7
        with:
          reports: '**/coverage-*/**/*.cobertura.xml'
          targetdir: ./CoverageReport
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub;Badges'
          assemblyfilters: '+MonacoEditorComponent'
          classfilters: '-*.Generated*'

      - name: Publish coverage summary
        run: cat ./CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
          if-no-files-found: warn

  sign:
    name: Sign
    runs-on: windows-latest
    needs: [build, desktop-tests, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: PackageSign
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Export relative artifacts path
        shell: pwsh
        run: |
          $relativePath = [System.IO.Path]::GetRelativePath((Get-Location), "${{ env.ARTIFACTS_DIR }}")
          "ARTIFACTS_DIR_REL=$relativePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Install Sign CLI tool
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1

      - name: Az CLI login
        uses: azure/login@v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}

      - name: Sign artifacts
        shell: pwsh
        run: >-
          ./sign code azure-key-vault "${{ env.ARTIFACTS_DIR_REL }}/**/*.nupkg" --publisher-name "uno.monaco.editor"
          --description "Uno Monaco Editor"
          --description-url "https://github.com/${{ github.repository }}"
          --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}"
          --verbosity information

      - name: Upload signed packages
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-Signed
          path: ${{ env.ARTIFACTS_DIR }}

  publish_dev:
    name: Publish Dev
    runs-on: ubuntu-latest
    environment: Development
    needs: sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uno feed publish
        uses: ./.github/actions/nuget-uno-publish
        with:
          token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}

      - name: nuget.org publish
        uses: ./.github/actions/nuget-org-publish
        with:
          token: ${{ secrets.NUGET_ORG_API_KEY }}

  publish_release_uno:
    name: Publish Internal Feed
    runs-on: ubuntu-latest
    environment: Production
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uno feed publish
        uses: ./.github/actions/nuget-uno-publish
        with:
          token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}

  publish_release_nuget_org:
    name: Publish Production
    runs-on: ubuntu-latest
    environment: Production
    needs: publish_release_uno
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: nuget.org publish
        uses: ./.github/actions/nuget-org-publish
        with:
          token: ${{ secrets.NUGET_ORG_API_KEY }}

      - name: Tag Release
        uses: ./.github/actions/tag-release
