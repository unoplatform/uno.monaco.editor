name: CI

on:
  push:
    branches:
      - main
      - release/*/*
  pull_request:
    branches:
      - main
      - release/*/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip
  ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
  PLAYWRIGHT_VERSION: '1.58.0'

# Required secrets for signing and publishing jobs:
# - SIGN_AZURE_CLIENT_ID: Azure client ID for code signing
# - SIGN_AZURE_TENANT_ID: Azure tenant ID for code signing
# - SIGN_AZURE_SUBSCRIPTION_ID: Azure subscription ID for code signing
# - SIGN_KEY_VAULT_URL: Azure Key Vault URL for code signing
# - SIGN_KEY_VAULT_CERTIFICATE_ID: Key Vault certificate ID for code signing
# - UNO_NUGET_FEED_API_KEY: API key for Uno NuGet feed publishing
# - NUGET_ORG_API_KEY: API key for NuGet.org publishing

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version (NBGV)
        id: nbgv
        uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
        with:
          toolVersion: 3.8.118
          setAllVars: true

      - name: Export informative version
        shell: pwsh
        run: |
          $buildingRef = "${{ github.ref }}"
          $informationalVersion = "${{ steps.nbgv.outputs.SemVer2 }}+${{ steps.nbgv.outputs.GitCommitId }}-$buildingRef" -replace 'refs/heads/','' -replace '/','-'
          "NBGV_AssemblyInformationalVersion=$informationalVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install wasm-tools wasm-tools-net9

      - name: Install WebKitGTK (Linux WebView2 runtime)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      - name: Prepare artifacts directory
        run: |
          rm -rf "${{ env.ARTIFACTS_PATH }}"
          mkdir -p "${{ env.ARTIFACTS_PATH }}/log"

      - name: Build library
        run: dotnet build MonacoEditorComponent/MonacoEditorComponent.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}" /bl:"${{ env.ARTIFACTS_PATH }}/log/build.binlog"

      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Build WASM test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-browserwasm -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright
        with:
          playwright-version: ${{ env.PLAYWRIGHT_VERSION }}

      - name: Run tests
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}" --no-build --coverage --coverage-output-format cobertura --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=DesktopCDP" --report-xunit --report-xunit-filename test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-ubuntu
          path: |
            ${{ runner.temp }}/TestResults/test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuGet
          path: ${{ env.ARTIFACTS_PATH }}/package/release
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ env.ARTIFACTS_PATH }}/log
          if-no-files-found: warn

  desktop-tests:
    name: Desktop Tests (Windows)
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Build desktop test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-desktop -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright
        with:
          playwright-version: ${{ env.PLAYWRIGHT_VERSION }}

      # Windows runners have WebView2 Runtime + Edge pre-installed and support CDP.
      # DesktopCDP tests are enabled here; WASM Playwright tests are covered by Ubuntu.
      # Note: the fixture always sets --remote-debugging-port via the WEBVIEW2_* env var, and
      # because this runner executes elevated (High Integrity Level) -- where WebView2 v150
      # drops that env var (WebView2Feedback #5640) -- it additionally publishes the switch
      # through the HKLM WebView2 policy. See DesktopAppFixture.PublishHklmBrowserArgumentsAsync.
      - name: Run tests (unit + DesktopCDP)
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}" --no-build --coverage --coverage-output-format cobertura --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=WasmPlaywright" --report-xunit --report-xunit-filename desktop-test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          path: |
            ${{ runner.temp }}/TestResults/desktop-test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  build-macos:
    name: Build (macOS ARM)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Install npm dependencies and build Monaco bundles
        run: npm install && npm run build

      - name: Build library
        run: dotnet build MonacoEditorComponent/MonacoEditorComponent.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Build test project
        run: dotnet build MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Build WASM test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-browserwasm -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Build desktop test app
        run: dotnet build MonacoEditorTestApp/MonacoEditorTestApp.csproj -f net10.0-desktop -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}"

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright
        with:
          playwright-version: ${{ env.PLAYWRIGHT_VERSION }}

      # WASM Playwright tests are already covered by the ubuntu job.
      # macOS ARM validates builds + unit tests; exclude DesktopCDP (headless), WasmPlaywright and
      # StaticServer -- a python http.server on this runner accepts the connection and then never
      # answers, which is the same thing that keeps the WASM suite off this job.
      - name: Run tests
        run: dotnet test --project MonacoEditorComponent.Tests/MonacoEditorComponent.Tests.csproj -c Release -p:ArtifactsPath="${{ env.ARTIFACTS_PATH }}" --no-build --coverage --coverage-output-format cobertura --results-directory ${{ runner.temp }}/TestResults -- --filter-not-trait "Category=DesktopCDP" --filter-not-trait "Category=WasmPlaywright" --filter-not-trait "Category=StaticServer" --report-xunit --report-xunit-filename test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-macos
          path: |
            ${{ runner.temp }}/TestResults/test-results.xml
            **/test-artifacts/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: ${{ runner.temp }}/TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [build, desktop-tests, build-macos]
    if: always()
    steps:
      - name: Download coverage (ubuntu)
        uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu
          path: ./coverage-ubuntu
        continue-on-error: true

      - name: Download coverage (windows)
        uses: actions/download-artifact@v4
        with:
          name: coverage-windows
          path: ./coverage-windows
        continue-on-error: true

      - name: Download coverage (macOS)
        uses: actions/download-artifact@v4
        with:
          name: coverage-macos
          path: ./coverage-macos
        continue-on-error: true

      - name: Merge and generate report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.7
        with:
          reports: '**/coverage-*/**/*.cobertura.xml'
          targetdir: ./CoverageReport
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub;Badges'
          assemblyfilters: '+MonacoEditorComponent'
          classfilters: '-*.Generated*'

      - name: Publish coverage summary
        run: cat ./CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
          if-no-files-found: warn

  sign:
    name: Sign
    runs-on: windows-latest
    needs: [build, desktop-tests, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: PackageSign
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: ${{ env.ARTIFACTS_PATH }}

      - name: Export relative artifacts path
        shell: pwsh
        run: |
          $relativePath = [System.IO.Path]::GetRelativePath((Get-Location), "${{ env.ARTIFACTS_PATH }}")
          "ARTIFACTS_PATH_REL=$relativePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Install Sign CLI tool
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1

      - name: Az CLI login
        uses: azure/login@v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}

      - name: Sign artifacts
        shell: pwsh
        run: >-
          ./sign code azure-key-vault "${{ env.ARTIFACTS_PATH_REL }}/**/*.nupkg" --publisher-name "uno.monaco.editor"
          --description "Uno Monaco Editor"
          --description-url "https://github.com/${{ github.repository }}"
          --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}"
          --verbosity information

      - name: Upload signed packages
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-Signed
          path: ${{ env.ARTIFACTS_PATH }}

  publish_dev:
    name: Publish Dev
    runs-on: ubuntu-latest
    environment: Development
    needs: sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uno feed publish
        uses: ./.github/actions/nuget-uno-publish
        with:
          token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}

      - name: nuget.org publish
        uses: ./.github/actions/nuget-org-publish
        with:
          token: ${{ secrets.NUGET_ORG_API_KEY }}

  publish_release_uno:
    name: Publish Internal Feed
    runs-on: ubuntu-latest
    environment: Production
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uno feed publish
        uses: ./.github/actions/nuget-uno-publish
        with:
          token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}

  publish_release_nuget_org:
    name: Publish Production
    runs-on: ubuntu-latest
    environment: Production
    needs: publish_release_uno
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: nuget.org publish
        uses: ./.github/actions/nuget-org-publish
        with:
          token: ${{ secrets.NUGET_ORG_API_KEY }}

      - name: Tag Release
        uses: ./.github/actions/tag-release
